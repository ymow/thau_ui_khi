[tool.poetry]
name = "voice-llm-agent"
version = "0.1.0"
description = "LiveKit agent for voice-enabled LLM interactions"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
livekit-agents = "^0.8.0"
livekit = "^0.11.0"
livekit-api = "^0.6.0"
python-dotenv = "^1.0.0"
deepgram-sdk = "^3.0.0"
groq = "^0.4.0"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
